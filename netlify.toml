[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect API calls to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_URL.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/fetch/*"
  to = "https://YOUR_RENDER_URL.onrender.com/fetch/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/analyze/*"
  to = "https://YOUR_RENDER_URL.onrender.com/analyze/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/predict/*"
  to = "https://YOUR_RENDER_URL.onrender.com/predict/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/notes/*"
  to = "https://YOUR_RENDER_URL.onrender.com/notes/:splat"
  status = 200
  force = true

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
